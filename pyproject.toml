[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-generator"
version = "1.0.0"
description = "Reproducible Electric Bastionland character and party generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Andrew Russell", email = "AndrewGRussell@gmail.com"}]
dependencies = []

[project.scripts]
bastion = "bastion.cli:main"

[tool.setuptools]
packages = ["bastion"]
include-package-data = false
py-modules = ["bastion_generator"]

[tool.setuptools.package-data]
bastion = ["data/*.json", "web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
